<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title description">
  <title id="title">PHP Blog</title>
  <desc id="description">Абстрактная обложка статьи</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20201e"/>
      <stop offset="1" stop-color="#4f3c35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e98559"/>
      <stop offset="1" stop-color="#c54f2c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="720" fill="url(#background)"/>
  <circle cx="1030" cy="90" r="250" fill="#ffffff" opacity=".05"/>
  <circle cx="150" cy="650" r="300" fill="#c54f2c" opacity=".14"/>
  <rect x="90" y="96" width="120" height="12" rx="6" fill="url(#accent)"/>
  <text x="90" y="330" fill="#ffffff" font-family="Arial, sans-serif" font-size="92" font-weight="700">PHP Blog</text>
  <text x="94" y="400" fill="#ffffff" opacity=".65" font-family="Arial, sans-serif" font-size="32">Практика серверной веб-разработки</text>
</svg>
